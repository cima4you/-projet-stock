[build]
  command = "pip install -r requirements.txt"
  functions = "netlify/functions"
  publish = "."

[[redirects]]
  from = "/"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/static/*"
  to = "/static/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api"
  status = 200

[functions]
  included_files = ["*.py", "*.db", "*.json", "email_templates/**", "static/**", "templates/**"]

[build.environment]
  PYTHON_VERSION = "3.11"
  SESSION_SECRET = "netlify-secret-change-in-production"
